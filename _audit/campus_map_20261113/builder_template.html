<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>校内地图 · 手拼工作台</title>
<style>
:root{--bg:#F7F8F8;--ink:#33403D;--sub:#6E7C78;--line:#E4E9E2;--teal:#4E9082;--teal-d:#2E6B5E;--sand:#B98F63;--warn:#B96B5A}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.45 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5}
.brand{font-weight:800;font-size:14px;margin-right:6px;white-space:nowrap}
.brand span{font-weight:400;font-size:11px;color:var(--sub);margin-left:6px}
.tb{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tb button{height:30px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
.tb button:hover{background:#F3F7F3}
.tb button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tb button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.tb button.danger{color:var(--warn);border-color:#EBD4CE}
.tb .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.tb input[type=range]{width:74px;vertical-align:middle}
main{flex:1;min-height:0;display:flex}
#wrap{flex:1;position:relative;min-width:0;background:#EDF1E6;touch-action:none;cursor:crosshair}
#wrap.pan{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:11px;color:var(--sub);pointer-events:none;display:flex;gap:12px;flex-wrap:wrap}
#hud b{color:var(--ink);font-variant-numeric:tabular-nums}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(46,107,94,.95);color:#fff;padding:6px 12px;border-radius:9px;font-size:12px;opacity:0;transition:.18s;pointer-events:none;z-index:9;max-width:80%}
#toast.on{opacity:1}
#drawBar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;align-items:center;gap:6px;background:rgba(255,255,255,.96);border:1px solid #DDE6DE;border-radius:10px;padding:6px 8px;box-shadow:0 6px 22px rgba(40,60,50,.16);z-index:8;flex-wrap:wrap;max-width:calc(100% - 20px)}
#drawBar.on{display:flex}
#drawBar span{font-size:12px;color:#5A6A67;margin:0 4px;white-space:nowrap}
#drawBar button{height:30px;padding:0 10px;border:1px solid #E4E9E2;border-radius:7px;background:#fff;font-size:12px;cursor:pointer}
#drawBar button.primary{background:#4E9082;border-color:#4E9082;color:#fff}
#drawBar button.danger{color:#B96B5A;border-color:#EBD4CE}
aside{width:276px;flex:none;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside .ah{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
aside .ah b{font-size:12px;letter-spacing:.06em;color:var(--sub)}
#panel{overflow:auto;padding:10px 12px;flex:1;min-height:0}
.hint{font-size:12px;color:var(--sub);line-height:1.8}
.hint b{color:var(--ink)}
.grp{margin-bottom:10px}.grp>label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
input[type=text],input[type=number],select{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:#FBFCFB;padding:0 8px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(78,144,130,.12)}
.row{display:flex;gap:6px}.row>*{flex:1;min-width:0}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btns button{height:30px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;cursor:pointer}
.btns button:hover{background:#F3F7F3}.btns button.danger{color:var(--warn);border-color:#EBD4CE}
.cat{display:flex;flex-direction:column;gap:5px}
.cat button{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;cursor:pointer;overflow:hidden}
.cat button:hover{background:#F3F7F3;border-color:#C9D8CE}
.cat button.on{border-color:var(--teal);background:#EAF4EF}
.cat small{color:var(--sub);font-size:10.5px;flex:none}
.meta{font-size:11px;color:var(--sub);line-height:1.7}
kbd{font:11px ui-monospace,Consolas,monospace;background:#F1F4EF;border:1px solid #E0E6DE;border-radius:4px;padding:0 4px}
@media (max-width:760px){
  .brand span{display:none}.brand{font-size:13px;margin-right:4px}
  header{padding:6px 8px;gap:4px;flex-wrap:nowrap;overflow:visible;align-items:center}
  .brand{flex:none}
  .tb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:4px;padding:6px 7px 8px;background:rgba(255,255,255,.97);border-top:1px solid #E4E9E2;box-shadow:0 -4px 18px rgba(30,50,40,.10);-webkit-overflow-scrolling:touch}
  .tb::-webkit-scrollbar{display:none}
  .tb .sep{display:none}
  .tb input[type=range]{display:none}
  .tb button{flex:0 0 auto;height:42px;min-width:52px;padding:0 9px;font-size:12px;border-radius:10px}
  .tb button.on{box-shadow:none}
  #cloudState{flex:0 0 auto;align-self:center;font-size:10px;min-width:44px}
  main{position:relative;padding-bottom:62px}
  aside{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-height:58vh;z-index:60;transform:translateY(105%);transition:transform .2s ease;border-radius:16px 16px 0 0;box-shadow:0 -12px 34px rgba(30,50,40,.22);border-left:0;border-top:1px solid #E4E9E2}
  aside.open{transform:none}
  aside .ah{padding:10px 14px;position:sticky;top:0;background:#fff;z-index:2}
  #btnPanel{display:inline-flex!important}
  #panelClose{display:inline-flex!important}
  #panel{max-height:calc(58vh - 42px);-webkit-overflow-scrolling:touch}
  #hud{font-size:10px;gap:8px;left:6px;bottom:68px;padding:4px 8px}
  #drawBar{bottom:68px;padding:6px 7px;border-radius:12px;max-width:calc(100% - 12px)}
  #drawBar button{height:40px;padding:0 11px;font-size:12px}
  #drawBar span{font-size:11px;line-height:1.35}
  .cat button{height:42px;font-size:12px}
  input[type=text],input[type=number],select{height:36px;font-size:13px}
  .btns button{height:38px}
  #mobileActions{display:flex;position:fixed;right:8px;bottom:74px;z-index:55;flex-direction:column;gap:6px}
  #mobileActions button{height:44px;min-width:48px;padding:0 8px;border:1px solid #DCE6DE;border-radius:11px;background:rgba(255,255,255,.96);font-size:12px;box-shadow:0 4px 14px rgba(30,50,40,.15)}
  body.dock-hidden .tb{display:none}
  body.dock-hidden main{padding-bottom:0}
  body.dock-hidden #hud{bottom:8px}
  body.dock-hidden #drawBar{bottom:8px}
  body.dock-hidden #mobileActions{bottom:8px}
}
@media (min-width:761px){#mobileActions{display:none}}
#btnPanel,#panelClose{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">校内地图 · 手拼工作台<span>校方总平面图 · 自己描路/摆楼</span></div>
    <div class="tb">
      <button id="toolSel" class="on">选择</button>
      <button id="toolPan">移动</button>
      <button id="toolRoad">道路</button>
      <button id="toolWater">水域</button>
      <button id="toolIsland">岛屿</button>
      <button id="toolGreen">绿地</button>
      <button id="toolPlaza">广场</button>
      <button id="toolBld">建筑</button>
      <button id="toolCustom">自定义建筑</button>
      <span class="sep"></span>
      <button id="btnBgCal">底图校准</button>
      <button id="btnGuides">参考路网</button>
      <button id="btnTidy">一键整理路网</button>
      <button id="btnCleanB">轮廓编辑</button>
      <button id="btnPanel">面板</button>
      <span class="sep"></span>
      <button id="btnUndo">↶</button><button id="btnRedo">↷</button>
      <button id="btnFit">适应窗口</button>
      <button id="btnSave" class="primary">保存</button>
      <button id="btnExport" class="primary">导出 JSON</button>
      <span id="cloudState" class="meta" style="min-width:52px;text-align:center">本地</span>
      <button id="btnImport">导入</button>
      <button id="btnClear" class="danger">清空</button>
      <span class="sep"></span>
      <span class="meta">底图</span><input id="bgOp" type="range" min="0" max="100" value="75"><span class="meta" id="bgPct">75%</span>
    </div>
    <input id="fileIn" type="file" accept=".json" hidden>
  </header>
  <main>
    <div id="wrap"><canvas id="cv"></canvas>
      <div id="mobileActions">
        <button id="maTools" type="button">工具</button>
        <button id="maSave" type="button">保存</button>
        <button id="maUndo" type="button">↶</button>
        <button id="maBg" type="button">底图</button>
        <button id="maCal" type="button">对齐</button>
      </div>
      <div id="hud"><span>坐标 <b id="hxy">-</b></span><span>缩放 <b id="hz">-</b></span><span id="hTool">选择</span><span id="hSel">未选中</span></div>
      <div id="toast"></div>
      <div id="drawBar" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()"><span id="drawInfo">道路</span><button id="dbFinish" class="primary">完成（Enter）</button><button id="dbUndo">撤销上一点</button><button id="dbCancel" class="danger">取消</button></div>
    </div>
    <aside>
      <div class="ah"><b id="ptitle">工具说明</b><span class="meta" id="pcount"></span><button id="panelClose" style="height:30px;padding:0 10px;border:1px solid #E4E9E2;border-radius:8px;background:#fff;font-size:12px;margin-left:auto">收起</button></div>
      <div id="panel"></div>
    </aside>
  </main>
</div>
<script>
var DATA = __DATA__;
var bgImg = new Image();
bgImg.onload = function(){ draw(); };
bgImg.src = "data:image/jpeg;base64," + DATA.bg;
var CW = DATA.master[0], CH = DATA.master[1];
var BB = DATA.bbox;
var state = { buildings: [], roads: [], water: [], islands: [], green: [], plaza: [] };
var view = { s: 1, ox: 0, oy: 0 };
var tool = "select", PLACE = null, GHOST = null;
var DRAW = null;            // { type, pts, cur }
var SEL = null;             // {type,id,vi}
var DRAG = null, PAN = null, RAF = null, POINTERS = {}, PINCH = null;
var bgOp = 0.75, GUIDE_ON = false, SHAPE = false, ADDV = false;
var BGT = {x:0,y:0,s:1,rot:0}, BGPAN = null, BGCAL = false;
var DKEY = DATA.seed ? "campus_builder_loaded_v2" : "campus_builder_v1";
var DRAWKEY = DKEY + "_draw";
var CLOUD_ON = location.protocol === "http:" || location.protocol === "https:";
var CLOUD_REV = 0, CLOUD_BUSY = false, CLOUD_TM = null;
function cloudTag(t, ok){var el=document.getElementById("cloudState");if(el){el.textContent=t;el.style.color=ok===false?"#B96B5A":"#4E9082"}}
function cloudPull(force){
  if(!CLOUD_ON)return;
  fetch("./api/state",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d||!d.state)return;
    if(d.rev>CLOUD_REV || force){
      if(!force && (DRAG||DRAW||PLACE)){cloudTag("远端有更新",false);return}
      state=d.state; normalizeState(); loadBGT();
      CLOUD_REV=d.rev; renderPanel(); draw(); cloudTag("已同步");
      if(force) toast("已从云端载入");
    }
  }).catch(function(){cloudTag("离线",false)});
}
function cloudPush(force){
  if(!CLOUD_ON||CLOUD_BUSY)return;
  CLOUD_BUSY=true; cloudTag("同步中");
  fetch("./api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({baseRev:CLOUD_REV,state:state})}).then(function(r){
    if(r.status===409){cloudTag("冲突",false);CLOUD_BUSY=false;cloudPull(true);return null}
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(d){CLOUD_BUSY=false;if(d&&d.rev){CLOUD_REV=d.rev;cloudTag("已同步")}}).catch(function(){CLOUD_BUSY=false;cloudTag("离线",false)});
}
function scheduleCloud(){if(!CLOUD_ON)return;clearTimeout(CLOUD_TM);CLOUD_TM=setTimeout(function(){cloudPush(false)},700)}
var SAVE_TM = null;
function loadBGT(){BGT=Object.assign({x:0,y:0,s:1,rot:0},(state&&state.bgTransform)||{})}
function saveBGT(){state.bgTransform={x:BGT.x,y:BGT.y,s:BGT.s,rot:BGT.rot}}
function normalizeState(){
  ["buildings","roads","water","islands","green","plaza"].forEach(function(k){if(!Array.isArray(state[k]))state[k]=[]});
}
function saveDraft(){try{localStorage.setItem(DKEY,JSON.stringify(state));localStorage.setItem(DRAWKEY,DRAW?JSON.stringify(DRAW):"")}catch(e){}}
function scheduleSave(){saveBGT();clearTimeout(SAVE_TM);SAVE_TM=setTimeout(function(){saveDraft();scheduleCloud()},300)}
var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), wrap = document.getElementById("wrap");
var W = 0, H = 0, DPR = Math.max(1, devicePixelRatio || 1);
var HIST = [], HP = -1;

function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove("on")},1800)}
function sched(){if(RAF)return;RAF=requestAnimationFrame(function(){RAF=null;draw()})}
function showDrawBar(){var b=document.getElementById("drawBar");b.classList.add("on");var n={road:"道路",water:"水域",green:"绿地",plaza:"广场"}[DRAW.type]||"绘制";document.getElementById("drawInfo").textContent=n+" · 已落 "+(DRAW.pts?DRAW.pts.length:0)+" 点（双击/Enter 完成）"}
function hideDrawBar(){document.getElementById("drawBar").classList.remove("on")}
function clone(o){return JSON.parse(JSON.stringify(o))}
function snap(v){return Math.round(v*2)/2}
function pushHist(){HIST=HIST.slice(0,HP+1);HIST.push(JSON.stringify(state));if(HIST.length>80)HIST.shift();HP=HIST.length-1;document.getElementById("btnUndo").disabled=HP<=0;document.getElementById("btnRedo").disabled=HP>=HIST.length-1;try{localStorage.setItem(DKEY,JSON.stringify(state))}catch(e){}}
function undo(){if(HP>0){HP--;state=JSON.parse(HIST[HP]);SEL=null;renderPanel();draw()}}
function redo(){if(HP<HIST.length-1){HP++;state=JSON.parse(HIST[HP]);SEL=null;renderPanel();draw()}}
function resize(){DPR=Math.max(1,devicePixelRatio||1);W=wrap.clientWidth;H=wrap.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);draw()}
function fit(){var w=BB[2]-BB[0],h=BB[3]-BB[1],pad=40;var s=Math.min((W-pad*2)/w,(H-pad*2)/h)*1.55;view.s=Math.max(0.1,Math.min(2.2,s));view.ox=W/2-(BB[0]+BB[2])/2*view.s;view.oy=H/2-(BB[1]+BB[3])/2*view.s;document.getElementById("hz").textContent=Math.round(view.s*100)+"%";draw()}
function sx(x){return x*view.s+view.ox}function sy(y){return y*view.s+view.oy}
function mx(x){return (x-view.ox)/view.s}function my(y){return (y-view.oy)/view.s}
function inPoly(x,y,pts){var inside=false,n=pts.length,j=n-1;for(var i=0;i<n;i++){var xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;j=i}return inside}
function segD(px,py,ax,ay,bx,by){var dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;var t=L2<1e-9?0:Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/L2));return {d:Math.hypot(px-(ax+t*dx),py-(ay+t*dy)),t:t}}
function polyPath(pts){ctx.beginPath();ctx.moveTo(sx(pts[0][0]),sy(pts[0][1]));for(var i=1;i<pts.length;i++)ctx.lineTo(sx(pts[i][0]),sy(pts[i][1]));ctx.closePath()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#EDF1E6";ctx.fillRect(0,0,W,H);
  if(bgImg.complete&&bgOp>0){
    ctx.save();
    ctx.translate(view.ox + (CW/2 + BGT.x) * view.s, view.oy + (CH/2 + BGT.y) * view.s);
    ctx.rotate(BGT.rot * Math.PI/180);
    ctx.scale(BGT.s, BGT.s);
    ctx.globalAlpha=bgOp;
    ctx.drawImage(bgImg, -CW*view.s/2, -CH*view.s/2, CW*view.s, CH*view.s);
    ctx.globalAlpha=1; ctx.restore();
  }
  /* AMap 参考路网（淡） */
  if(GUIDE_ON && DATA.guides){DATA.guides.forEach(function(g){if(!g.p||g.p.length<2)return;ctx.beginPath();ctx.moveTo(sx(g.p[0][0]),sy(g.p[0][1]));for(var i=1;i<g.p.length;i++)ctx.lineTo(sx(g.p[i][0]),sy(g.p[i][1]));ctx.strokeStyle="rgba(90,150,200,.32)";ctx.lineWidth=Math.max(1,2.2*view.s);ctx.setLineDash([4,5]);ctx.stroke();ctx.setLineDash([])})}
  /* water */
  ctx.fillStyle="rgba(120,190,220,.22)";ctx.strokeStyle="rgba(70,150,185,.8)";ctx.lineWidth=1;
  state.water.forEach(function(p){if(p.length>=3){polyPath(p);ctx.fill();ctx.stroke()}});
  /* 岛屿（盖在水面上） */
  ctx.fillStyle="rgba(215,232,198,.92)";ctx.strokeStyle="rgba(110,150,90,.9)";ctx.lineWidth=1.2;
  (state.islands||[]).forEach(function(p){if(p.length>=3){polyPath(p);ctx.fill();ctx.stroke()}});
  /* green */
  ctx.fillStyle="rgba(150,200,110,.25)";ctx.strokeStyle="rgba(100,160,80,.7)";
  state.green.forEach(function(p){if(p.length>=3){polyPath(p);ctx.fill();ctx.stroke()}});
  /* plaza */
  ctx.fillStyle="rgba(220,200,160,.38)";ctx.strokeStyle="rgba(180,150,100,.7)";
  state.plaza.forEach(function(p){if(p.length>=3){polyPath(p);ctx.fill();ctx.stroke()}});
  /* roads */
  state.roads.forEach(function(r){if(!r.p.length)return;ctx.beginPath();ctx.moveTo(sx(r.p[0][0]),sy(r.p[0][1]));for(var i=1;i<r.p.length;i++)ctx.lineTo(sx(r.p[i][0]),sy(r.p[i][1]));ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="rgba(60,45,30,.55)";ctx.lineWidth=Math.max(3,(r.w||10)*view.s+2);ctx.stroke();ctx.strokeStyle="rgba(184,158,120,.82)";ctx.lineWidth=Math.max(2,(r.w||10)*view.s);ctx.stroke();ctx.strokeStyle="rgba(255,250,240,.30)";ctx.lineWidth=Math.max(1,(r.w||10)*view.s*0.35);ctx.stroke();if(view.s>0.5){var mid=r.p[Math.floor(r.p.length/2)];ctx.fillStyle="#5A4630";ctx.font="600 10px 'Microsoft YaHei'";ctx.textAlign="center";ctx.fillText(r.name||"",sx(mid[0]),sy(mid[1])-6)}});
  /* buildings */
  state.buildings.forEach(function(b){if(!b.p||b.p.length<3)return;polyPath(b.p);ctx.fillStyle=b.id===SEL0("bld")?"rgba(78,144,130,.55)":"rgba(198,140,105,.72)";ctx.fill();ctx.strokeStyle=b.id===SEL0("bld")?"#2E6B5E":"rgba(90,60,45,.5)";ctx.lineWidth=b.id===SEL0("bld")?2:1;ctx.stroke();if(view.s>0.35){var c=[b.x,b.y];ctx.font="700 10px 'Microsoft YaHei'";ctx.textAlign="center";ctx.textBaseline="middle";var tx=(b.no?b.no+"# ":"")+(b.n||"");ctx.lineWidth=3;ctx.strokeStyle="rgba(255,252,245,.85)";ctx.strokeText(tx,sx(c[0]),sy(c[1]));ctx.fillStyle="#4A3B34";ctx.fillText(tx,sx(c[0]),sy(c[1]))}});
  /* handles */
  if(SEL){var hp=selPts();if(hp&&(SEL.type!=="bld"||SHAPE)){hp.forEach(function(p,i){if(i===SEL.vi){ctx.beginPath();ctx.arc(sx(p[0]),sy(p[1]),6,0,Math.PI*2);ctx.fillStyle="#4E9082";ctx.fill()}else{ctx.beginPath();ctx.arc(sx(p[0]),sy(p[1]),4,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#4E9082";ctx.lineWidth=2;ctx.stroke()}}) }}
  /* drawing preview */
  if(DRAW&&DRAW.pts.length){var pts=DRAW.pts.slice();if(DRAW.cur)pts.push(DRAW.cur);ctx.beginPath();ctx.moveTo(sx(pts[0][0]),sy(pts[0][1]));for(var i=1;i<pts.length;i++)ctx.lineTo(sx(pts[i][0]),sy(pts[i][1]));ctx.strokeStyle="rgba(78,144,130,.9)";ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.stroke();ctx.setLineDash([]);for(var j=0;j<DRAW.pts.length;j++){ctx.beginPath();ctx.arc(sx(DRAW.pts[j][0]),sy(DRAW.pts[j][1]),3.5,0,Math.PI*2);ctx.fillStyle="#4E9082";ctx.fill()}}

  }
  /* 已选中的水域/绿地/广场/岛屿：先判断是否点顶点 */
  if(SEL&&(["water","islands","green","plaza"].indexOf(SEL.type)>=0)){
    var ap=selPts();var vhit=null;
    if(ap)for(var avi=0;avi<ap.length;avi++){if(Math.hypot(x-ap[avi][0],y-ap[avi][1])*view.s<14){vhit=avi;break}}
    if(vhit!=null){SEL.vi=vhit;DRAG={type:"avert",kind:SEL.type,id:SEL.id,vi:vhit,start:[x,y],sx:px,sy:py,moved:false};renderPanel();draw();return}
  }
  var hit=hitTest(x,y);
  if(SEL&&hit&&hit.type!=="bld")SHAPE=false;
  SEL=hit;if(SEL)SEL.vi=null;renderPanel();draw();
  if(hit&&["water","islands","green","plaza"].indexOf(hit.type)>=0){
    /* 水域等大面：单击选中，拖动平移画布（不再整块误移动） */
    PAN={sx:px,sy:py,ox:view.ox,oy:view.oy,moved:false};
    return;
  }
  if(hit){var obj=findSel();
    if(hit.type==="bld"||hit.type==="road"){DRAG={hit:hit,start:[x,y],sx:px,sy:py,moved:false,orig:obj?clone(obj.p||obj.pts):null}}
  }else{PAN={sx:px,sy:py,ox:view.ox,oy:view.oy,moved:false}}
});
wrap.addEventListener("pointermove",function(e){
  if(POINTERS[e.pointerId])POINTERS[e.pointerId]={x:e.clientX,y:e.clientY};
  if(PINCH&&Object.keys(POINTERS).length>=2){
    var ids=Object.keys(POINTERS),a=POINTERS[ids[0]],b=POINTERS[ids[1]];
    var d=Math.hypot(a.x-b.x,a.y-b.y)||1,mx2=(a.x+b.x)/2,my2=(a.y+b.y)/2;
    var rect=cv.getBoundingClientRect();
    var wx=(PINCH.mx-rect.left-PINCH.ox)/PINCH.s, wy=(PINCH.my-rect.top-PINCH.oy)/PINCH.s;
    view.s=Math.max(0.05,Math.min(3,PINCH.s*d/PINCH.d));
    view.ox=(mx2-rect.left)-wx*view.s; view.oy=(my2-rect.top)-wy*view.s;
    document.getElementById("hz").textContent=Math.round(view.s*100)+"%";
    sched();return;
  }
  var r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,x=mx(px),y=my(py);document.getElementById("hxy").textContent=Math.round(x)+", "+Math.round(y);
  if(tool==="bld"){if(PLACE){GHOST=clone(PLACE);GHOST.p=PLACE.p.map(function(p){return [p[0]-PLACE.cx+x,p[1]-PLACE.cy+y]});GHOST.x=x;GHOST.y=y;sched()}return}
  if(BGPAN){
    BGT.x=BGPAN.x+(px-BGPAN.sx)/view.s; BGT.y=BGPAN.y+(py-BGPAN.sy)/view.s;
    scheduleSave(); sched(); return;
  }
  if(DRAW){DRAW.cur=[snap(x),snap(y)];sched();return}
  if(PAN){if(!PAN.moved&&Math.hypot(px-PAN.sx,py-PAN.sy)<3)return;PAN.moved=true;wrap.classList.add("pan");view.ox=PAN.ox+(px-PAN.sx);view.oy=PAN.oy+(py-PAN.sy);sched();return}
  if(DRAG){if(!DRAG.moved&&Math.hypot(px-DRAG.sx,py-DRAG.sy)<3)return;if(!DRAG.moved){DRAG.moved=true;pushHist()}var dx=x-DRAG.start[0],dy=y-DRAG.start[1];var hit=DRAG.hit;
    if(DRAG.type==="avert"){
      var ap=state[DRAG.kind][DRAG.id];
      if(ap&&ap[DRAG.vi]){ap[DRAG.vi]=[snap(x),snap(y)];sched();return}
    }
    if(DRAG.type==="bldvert"){
      var bb=state.buildings.find(function(q){return q.id===DRAG.id});
      if(bb&&bb.p[DRAG.vi]){bb.p[DRAG.vi]=[x,y];var cc=centroid(bb.p);bb.x=cc[0];bb.y=cc[1];sched();return}
    }
    if(hit.type==="bld"){var b=state.buildings.find(function(q){return q.id===hit.id});b.p=DRAG.orig.map(function(p){return [p[0]+dx,p[1]+dy]});var cx=0,cy=0;b.p.forEach(function(p){cx+=p[0];cy+=p[1]});b.x=cx/b.p.length;b.y=cy/b.p.length}
    else if(hit.type==="road"){var rd=state.roads.find(function(q){return q.id===hit.id});rd.p=DRAG.orig.map(function(p){return [p[0]+dx,p[1]+dy]})}
    else{state[hit.type][hit.id]=DRAG.orig.map(function(p){return [p[0]+dx,p[1]+dy]})}
    sched();return}
});
wrap.addEventListener("pointerup",function(e){
  delete POINTERS[e.pointerId];
  if(BGPAN){BGPAN=null;wrap.classList.remove("pan");scheduleSave();draw();return}
  if(PINCH&&Object.keys(POINTERS).length<2){PINCH=null;PAN=null;DRAG=null;scheduleSave();draw();return}
  wrap.classList.remove("pan");
  if(PAN){PAN=null;return}
  if(DRAG){DRAG=null;renderPanel();draw()}
});
wrap.addEventListener("pointercancel",function(e){delete POINTERS[e.pointerId];if(Object.keys(POINTERS).length<2)PINCH=null;PAN=null;DRAG=null});
wrap.addEventListener("dblclick",function(e){
  if(DRAW){finishDraw();return}
  if(SHAPE&&SEL&&SEL.type==="bld"){
    var b=findSel();if(b&&b.p){var r=cv.getBoundingClientRect(),x=mx(e.clientX-r.left),y=my(e.clientY-r.top);var ne=nearestEdge(b.p,x,y);pushHist();b.p.splice(ne.i,0,[round2(ne.q[0]),round2(ne.q[1])]);SEL.vi=ne.i;var cc=centroid(b.p);b.x=cc[0];b.y=cc[1];scheduleSave();renderPanel();draw();return}
  }
});
wrap.addEventListener("contextmenu",function(e){if(DRAW){e.preventDefault();finishDraw();return}});
wrap.addEventListener("wheel",function(e){e.preventDefault();var r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;var wx=mx(px),wy=my(py);var f=Math.exp(-e.deltaY*0.0012);view.s=Math.max(0.05,Math.min(3,view.s*f));view.ox=px-wx*view.s;view.oy=py-wy*view.s;document.getElementById("hz").textContent=Math.round(view.s*100)+"%";draw()},{passive:false});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&DRAW){e.preventDefault();finishDraw();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&DRAW){e.preventDefault();DRAW.pts.pop();showDrawBar();scheduleSave();draw();return}
  if(e.key==="Escape"){DRAW=null;hideDrawBar();PLACE=null;GHOST=null;SEL=null;startTool("select");return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();redo()}if((e.key==="Delete"||e.key==="Backspace")&&SEL){if(SEL.type==="bld"&&SHAPE&&SEL.vi!=null){var b=findSel();if(b&&b.p.length>3){pushHist();b.p.splice(SEL.vi,1);SEL.vi=null;var cc=centroid(b.p);b.x=cc[0];b.y=cc[1];renderPanel();draw()}return}if(SEL.type==="bld"){pushHist();state.buildings=state.buildings.filter(function(b){return b.id!==SEL.id})}else if(SEL.type==="road"){pushHist();state.roads=state.roads.filter(function(r){return r.id!==SEL.id})}else{pushHist();state[SEL.type].splice(SEL.id,1)}SEL=null;renderPanel();draw()}});

window.addEventListener("resize",resize);window.addEventListener("beforeunload",saveDraft);
(function init(){
  var hadDraft=false;
  try{var raw=localStorage.getItem(DKEY);if(raw){var o=JSON.parse(raw);if(o&&o.buildings){state=o;hadDraft=true;normalizeState();toast("已恢复本机草稿")}}}catch(e){}
  if(!hadDraft&&DATA.seed){state=JSON.parse(JSON.stringify(DATA.seed));normalizeState();toast("已载入整理后的布局")}loadBGT();resize();fit();renderPanel();
  try{var rawD=localStorage.getItem(DRAWKEY);if(rawD){var dr=JSON.parse(rawD);if(dr&&dr.pts&&dr.pts.length){DRAW=dr;showDrawBar();draw()}}}catch(e){}
  document.getElementById("bgPct").textContent=Math.round(bgOp*100)+"%";
  if(CLOUD_ON){cloudTag("同步中");cloudPull(true);setInterval(function(){cloudPull(false)},5000)}
})();
