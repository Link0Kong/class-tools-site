name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。功能建议请说明使用场景，而不是只给实现方案。
  - type: dropdown
    id: platform
    attributes:
      label: 涉及的端
      options:
        - 网页端
        - 微信小程序
        - Android
        - HarmonyOS
        - Windows
        - 多端 / 通用
        - 文档 / 工程
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下需要它？现在是怎么解决的？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复建议
          required: true
        - label: 该建议不涉及真实班级数据或第三方平台的未授权接口
          required: true
