<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宿舍电费 · 预览 v4</title>
<style>
:root{
  --bg1:#FAF6EC; --bg2:#F4F0E6;
  --surface:#FFFCF6; --line:#E7DFD0; --line-strong:#E0D2BC;
  --ink:#303A35; --ink2:#5C6860; --ink3:#8B948B;
  --cy:#5E8F87; --mint:#EAF2EC; --sd:#C6A475; --danger:#B87870;
  --tint:#FBF6EC; --track:#EFE9DC;
  --elev:0 2px 10px rgba(72,64,44,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);min-height:100%;
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
body{padding:18px 14px 34px}
.wrap{max-width:1188px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px}
.title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800}
.bolt{width:34px;height:34px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-size:18px}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  font:inherit;font-size:13px;font-weight:700;min-height:40px;min-width:72px;padding:0 14px;border-radius:12px;cursor:pointer;transition:background .15s}
.btn:hover{background:#F7F9F8}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--elev);min-width:0}
.pw-dash{display:flex;flex-direction:column;gap:12px}
.hero{padding:14px;display:flex;flex-direction:column}
.sel-label{font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 6px}
.selwrap{position:relative}
.selwrap::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:12px;pointer-events:none}
select{display:block;width:100%;min-height:44px;padding:10px 38px 10px 12px;border:1px solid var(--line-strong);border-radius:12px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:600;line-height:1.3;
  appearance:none;-webkit-appearance:none;cursor:pointer;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
select:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.ring-box{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0 10px;position:relative}
.ring .track{stroke:var(--track)}
.ring .bar{stroke:var(--cy);transition:stroke-dashoffset .4s cubic-bezier(.2,.8,.3,1),stroke .22s}
.hero.warn .ring .bar{stroke:var(--sd)}
.hero.low .ring .bar{stroke:var(--danger)}
.ring-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;white-space:nowrap}
.ring-num{font-size:52px;font-weight:800;line-height:1.02;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.hero.low .ring-num{color:var(--danger)}
.ring-unit{font-size:13.5px;font-weight:700;color:var(--ink2);margin-left:3px}
.ring-days{font-size:11.5px;font-weight:600;color:var(--ink2);margin-top:4px}
.pill{display:inline-block;font-size:12px;font-weight:700;line-height:1.6;padding:1px 10px;border-radius:999px;margin-top:8px}
.pill.ok{background:var(--mint);color:#2F6555}
.pill.warn{background:#FAF3E6;color:#8A6A3E}
.pill.low{background:#F7EDEB;color:#8F5550}
.hero-foot{display:flex;justify-content:flex-end;font-size:11.5px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;padding-top:6px}
.lowbar{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:12px;
  background:#F7EDEB;border:1px solid #EEDBD7;color:#8A5049;font-size:13px;font-weight:700}
.lowbar .sp{flex:1}

.tr-card{padding:14px 14px 10px;display:flex;flex-direction:column;min-height:0}
.tr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.tr-title{font-size:14.5px;font-weight:800;white-space:nowrap}
.seg{display:flex;gap:0;background:#F2EDE2;border-radius:10px;padding:3px;min-height:40px;align-items:stretch}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12px;font-weight:700;
  padding:0 10px;min-width:44px;min-height:34px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(72,64,44,.12)}
.chart-shell{position:relative;flex:1;min-height:150px;display:flex;flex-direction:column}
.chart-scroll{flex:1;min-height:120px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;touch-action:pan-x;cursor:grab;position:relative}
.chart-scroll::-webkit-scrollbar{display:none}
.chart-scroll.dragging{cursor:grabbing;user-select:none}
.chart-inner{position:relative;height:100%;min-height:120px}
.chart-inner svg{display:block;width:100%;height:100%}
.yaxis{position:absolute;right:0;top:0;bottom:22px;width:56px;pointer-events:none;background:linear-gradient(90deg,rgba(255,252,246,0),var(--surface) 24%)}
.yaxis::before{content:"";position:absolute;left:8px;top:2px;bottom:0;border-left:1px solid var(--track)}
.yaxis span{position:absolute;left:14px;transform:translateY(-50%);font-size:10.5px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.xaxis{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;font-weight:600;color:var(--ink2);
  font-variant-numeric:tabular-nums;padding:4px 58px 0 2px}
.legend{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:600;color:var(--ink2);
  font-variant-numeric:tabular-nums;padding:6px 58px 0 2px}
.tr-empty{position:absolute;inset:0 56px 20px 0;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink2)}
.tr-empty::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--track)}
.tr-empty span{position:relative;padding:0 8px;background:var(--surface)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:86px;
  box-shadow:0 1px 2px rgba(72,64,44,.05);display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile .k{font-size:11.5px;font-weight:600;color:var(--ink2)}
.tile .v{font-size:24px;font-weight:800;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;font-weight:600;color:var(--ink2);margin-left:2px}
.tile .s{font-size:10.5px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
button.tile{appearance:none;font:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);width:100%}
button.tile:hover{background:#F7F9F8}
button.tile:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.thmask{position:fixed;inset:0;background:rgba(48,58,53,.18);z-index:60;display:none}
.thmask.on{display:block}
.thpop{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:61;width:min(420px,92vw);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 12px 40px rgba(48,58,53,.22);
  padding:16px;display:none}
.thpop.on{display:block}
.thpop .t{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.thpop .t button{appearance:none;border:0;background:#F2EDE2;color:var(--ink2);font:inherit;font-size:12px;font-weight:700;
  min-height:36px;padding:0 12px;border-radius:9px;cursor:pointer}
.thgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.thgrid button{appearance:none;border:1px solid var(--line);background:#FBF6EC;color:var(--ink2);font:inherit;
  font-size:13px;font-weight:700;min-height:44px;border-radius:10px;cursor:pointer}
.thgrid button.on{background:#E9F3F0;border-color:#BFD9D2;color:#2F6555}
.thgrid button:active{transform:scale(.98)}
.foot{margin:14px 4px 0;font-size:11px;font-weight:600;color:var(--ink2);line-height:1.6}
@media (max-width:400px){ .ring-num{font-size:47px} .seg button{padding:0 8px;min-width:40px} }
@media (min-width:720px){
  body{padding:22px 20px 40px}
  .pw-dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-areas:"hero side";gap:12px;align-items:stretch}
  .hero{grid-area:hero}
  .side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-height:0}
  .lowbar{grid-column:1/-1}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:960px){
  .pw-dash{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;min-height:max(620px,calc(100vh - 207px))}
  .hero{padding:18px 20px}
  .ring-num{font-size:64px}
  .side{display:grid;grid-template-rows:minmax(320px,1.3fr) minmax(240px,1fr);gap:12px}
  .tr-card{padding:16px 18px 10px}
  .tr-title{font-size:15px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tile{min-height:120px;padding:14px 16px}
  .tile .v{font-size:25px}
}
@media (min-width:1440px){ .wrap{max-width:1320px} .ring-num{font-size:72px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

    var start = end - hours*3600*1000;

  function rateFor(pts){
    if(!pts || pts.length < 2) return null;
    var used = 0, hours = 0;
    for(var i=1;i<pts.length;i++){
      var dt = (pts[i][0]-pts[i-1][0])/3600000;
      if(!(dt > 0)) continue;
      var dq = pts[i-1][1]-pts[i][1];
      if(dq > 0.05){ used += dq; hours += dt; }
      else if(dq < -0.05){ /* 充值跳变：整段跳过 */ }
      else { hours += dt; }
    }
    var span = (pts[pts.length-1][0]-pts[0][0])/3600000;
    if(span < 6 || hours <= 0) return null;
    return used/hours*24;
  }

    var pts = r.hist || [], now = Date.now();

  thGrid.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var v = Number(b.getAttribute('data-v'));
    if(!v) return;
    TH = v;
    try{ localStorage.setItem('pcp_preview_low', String(TH)); }catch(e){}
    closeTh();
    paint(sel.value);
  });

  sel.addEventListener('change', function(){ paint(sel.value); save(sel.value); });
  btn.addEventListener('click', function(){ btn.disabled=true; btn.textContent='刷新中'; setTimeout(function(){ btn.disabled=false; btn.textContent='刷新'; }, 450); });

  var savedRange = 0; try{ savedRange = Number(localStorage.getItem('pcp_preview_range')||0); }catch(e){}
  if(savedRange && ARC[savedRange]){
    RANGE = savedRange;
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function(x){ x.classList.toggle('on', Number(x.getAttribute('data-r'))===RANGE); });
  }
  var saved = load();
  paint(saved || DATA.default);
  if(!saved && DATA.default) save(DATA.default);
})();
</script>
</body>
</html>
