<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<style>
  :root{--bg:#F7F8F8;--ink:#23302E;--ink2:#5A6A67;--ink3:#8C9A97;--cy:#4E9082;--bl:#6E8CA8;--sd:#B98F63;--line:#E6E9E8}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{position:relative;width:1200px;height:630px;overflow:hidden}
  svg.scene{position:absolute;inset:0;width:1200px;height:630px}
  .in{position:absolute;inset:0;padding:74px 82px;display:flex;flex-direction:column}
  .dots{display:flex;gap:9px}
  .dots i{width:11px;height:11px;border-radius:50%}
  .dots i:nth-child(1){background:var(--cy)}.dots i:nth-child(2){background:var(--bl)}.dots i:nth-child(3){background:var(--sd)}
  .eyebrow{margin-top:26px;font-size:19px;letter-spacing:.2em;color:var(--ink3)}
  h1{margin-top:16px;font-size:92px;font-weight:800;letter-spacing:.03em;line-height:1.02}
  .tag{margin-top:18px;font-size:27px;color:var(--ink2);line-height:1.6}
  .tag b{color:var(--ink)}
  .spacer{flex:1}
  .foot{display:flex;align-items:center;gap:16px}
  .chip{font-size:19px;padding:9px 20px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
  .chip b{color:var(--cy)}
  .url{margin-left:auto;font-size:20px;letter-spacing:.06em;color:var(--cy);font-weight:600}
  .ph{position:absolute;right:82px;top:96px;width:210px;height:210px;border-radius:28px;overflow:hidden;
    border:6px solid #fff;box-shadow:0 18px 44px rgba(35,48,46,.16)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
</style></head>
<body>
<div class="wrap">
  <svg class="scene" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6E8CA8" stop-opacity=".24"/><stop offset="1" stop-color="#6E8CA8" stop-opacity=".05"/></linearGradient>
      <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E9082" stop-opacity=".30"/><stop offset="1" stop-color="#4E9082" stop-opacity=".06"/></linearGradient>
      <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E9082" stop-opacity=".18"/><stop offset="1" stop-color="#4E9082" stop-opacity=".03"/></linearGradient>
    </defs>
    <rect width="1200" height="630" fill="#F7F8F8"/>
    <circle cx="1030" cy="120" r="62" fill="#B98F63" opacity=".15"/>
    <path d="M0 400 L160 300 L320 392 L470 280 L620 380 L780 292 L940 388 L1090 306 L1200 396 L1200 630 L0 630Z" fill="url(#m1)"/>
    <path d="M0 470 L190 372 L360 462 L540 362 L720 460 L900 372 L1080 462 L1200 388 L1200 630 L0 630Z" fill="url(#m2)"/>
    <path d="M0 540 L220 470 L420 534 L650 466 L880 538 L1080 478 L1200 532 L1200 630 L0 630Z" fill="url(#m3)"/>
  </svg>
  <div class="ph"><img src="assets/avatar.jpg" alt=""></div>
  <div class="in">
    <span class="dots"><i></i><i></i><i></i></span>
    <p class="eyebrow">福建中医药大学 · 信息管理与信息系统</p>
    <h1>陈子麒</h1>
    <p class="tag">把<b>重复</b>交给脚本，把<b>喜欢</b>做到好看。</p>
    <div class="spacer"></div>
    <div class="foot">
      <span class="chip"><b>打铃系统</b></span>
      <span class="chip">游戏自动化</span>
      <span class="chip">班级工具站</span>
      <span class="url">me.furina.fun</span>
    </div>
  </div>
</div>
</body></html>
