<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>旗山校区地图</title>
<style>
  :root {
    color-scheme: light;
    --map-bg:#EDF1E7; --panel:#FCFDFA; --ink:#243831; --muted:#53685F;
    --line:#DCE5DB; --tint:#E8F0EA; --accent:#286753; --on-accent:#FFF;
    --shadow:0 8px 26px #2438311A;
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --map-bg:#1C2823; --panel:#24332D; --ink:#EFF5EF; --muted:#B6C9BE;
    --line:#405349; --tint:#32483E; --accent:#9DD9C1; --on-accent:#132D23;
    --shadow:0 8px 26px #0C14114D;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--map-bg);color:var(--ink)}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  #app{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  button,input,a{font:inherit}
  button{cursor:pointer;color:var(--ink);min-height:42px}
  button:disabled{opacity:.48;cursor:default}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .topbar{
    display:flex;align-items:center;gap:12px;z-index:5;flex:none;
    padding:8px 12px;
    padding:calc(8px + env(safe-area-inset-top, 0px)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{min-width:0;white-space:nowrap}
  .brand b{display:block;font-size:15px}
  .brand span{display:block;font-size:11px;color:var(--muted)}
  .embedded .brand{display:none}
  .searchwrap{flex:1;min-width:0;max-width:420px;position:relative}
  .searchbox{display:flex;align-items:center;gap:8px;padding-left:12px;
    background:var(--tint);border:1px solid var(--line);border-radius:11px;min-height:44px}
  .searchbox:focus-within{border-color:var(--accent)}
  .searchbox svg{flex:none;color:var(--muted)}
  .searchbox input{flex:1;min-width:0;height:42px;color:var(--ink);font-size:16px;
    background:transparent;border:0;outline:none;padding:0 6px 0 0}
  .searchbox input::placeholder{color:var(--muted)}
  .searchbox button,.icon{
    flex:none;width:42px;padding:0;border:0;border-radius:8px;background:transparent;font-size:20px
  }
  .results{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:55vh;
    overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px;
    background:var(--panel);box-shadow:var(--shadow)}
  .ritem{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;
    width:100%;padding:8px 13px;text-align:left;background:transparent;border:0}
  .ritem + .ritem{border-top:1px solid var(--line)}
  .ritem small,.rempty{font-size:12px;color:var(--muted)}
  .rempty{margin:0;padding:12px}
  .modes,.maptools{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:11px}
  .modes{margin-left:auto;gap:2px;padding:2px;background:var(--tint)}
  .modes button,.maptools button,.meta button,.rchips button,.btns button,.floors button,.roombtn{
    border:1px solid transparent;border-radius:8px;font-weight:650;white-space:nowrap
  }
  .modes button,.maptools button{background:transparent;padding:0 10px}
  .modes button.on,.rchips button.on,.floors button.on,.roombtn.on{background:var(--accent);color:var(--on-accent)}
  .workspace{position:relative;display:flex;flex:1;min-height:0}
  .mapstage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:var(--map-bg)}
  #scene{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #scene.dragging{cursor:grabbing}
  .maptools{position:absolute;top:10px;right:10px;right:max(10px,env(safe-area-inset-right));box-shadow:var(--shadow);padding:2px}
  .maptools button{min-width:42px;padding:0 8px}
  .maptools .zoom{font-size:20px;line-height:1}
  .maptools button + button{border-left-color:var(--line)}
  .maptools button:hover,.icon:hover,.ritem:hover{background:var(--tint)}
  .card{flex:none;width:288px;width:clamp(264px,28vw,320px);background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;z-index:2}
  .chead{display:flex;align-items:center;gap:4px;padding:12px 12px 10px 16px}
  .ctitle{min-width:0;flex:1}
  .ctitle h2{margin:0;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
  .ctitle p{margin:4px 0 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
  .cardBody{min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px 16px 16px}
  .meta,.rchips,.btns{display:flex;flex-wrap:wrap;gap:6px}
  .meta button,.rchips button,.btns button,.floors button,.roombtn{
    background:var(--tint);border-color:var(--line);padding:0 10px;font-size:13px
  }
  .meta button,.btns button{flex:1}
  .routebox{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .rhd{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:7px}
  .rhd b{font-size:12px;color:var(--accent)}
  .rpath{font-size:13px;line-height:1.55;color:var(--muted);margin:8px 0 0;overflow-wrap:anywhere}
  .btns{margin-top:10px}
  .details{display:none;padding:0 9px;font-size:13px;border:1px solid var(--line);
    border-radius:8px;background:var(--tint);color:var(--accent)}
  .minimap{position:absolute;left:10px;bottom:58px;width:154px;pointer-events:none;
    border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px;box-shadow:var(--shadow)}
  .minimap canvas{display:block;width:100%;height:auto;border-radius:6px}
  .aboutButton{position:absolute;left:10px;bottom:9px;left:max(10px,env(safe-area-inset-left));bottom:max(9px,env(safe-area-inset-bottom));
    color:var(--muted);background:var(--panel);padding:0 10px;border:1px solid var(--line);border-radius:9px;font-size:12px}
  .toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:10;opacity:0;
    background:var(--ink);color:var(--panel);border-radius:10px;padding:8px 14px;
    pointer-events:none;max-width:90%;text-align:center}
  .toast.on{opacity:1}
  .modal{position:absolute;left:0;right:0;top:0;bottom:0;z-index:20;background:#121F1980;
    display:flex;align-items:center;justify-content:center;padding:12px}
  .mcard{width:100%;max-width:460px;max-height:100%;overflow:auto;overscroll-behavior:contain;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px 16px;box-shadow:var(--shadow)}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .mhead h2{margin:0;font-size:17px}
  .msub,.note,.about p{color:var(--muted);font-size:13px}
  .msub{margin:0 0 10px}
  .floors{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
  .note{margin:8px 0 0}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:12px;height:12px;border-radius:3px;border:1px solid #2438312B}
  .err{position:absolute;left:12px;right:12px;bottom:12px;z-index:30;background:var(--panel);
    color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
  @media (max-width:859px),(max-height:420px){
    .brand,.minimap{display:none}
    .card{position:absolute;bottom:8px;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));left:max(8px,env(safe-area-inset-left));
      right:max(8px,env(safe-area-inset-right));width:auto;max-height:62%;border:1px solid var(--line);
      border-radius:13px;box-shadow:var(--shadow)}
    .chead{padding:5px 6px 5px 12px}
    .ctitle h2{font-size:15px}
    .ctitle p{font-size:11px}
    .cardBody{display:none;padding:3px 12px 10px}
    .card.expanded .cardBody{display:block}
    .details{display:block}
    .workspace.selected .aboutButton{bottom:78px}
    .workspace.expanded .aboutButton{display:none}
  }
  @media (max-width:360px){
    .topbar{gap:6px;padding-left:8px;padding-right:8px}
    .modes button{padding:0 7px}
    .searchbox{gap:5px;padding-left:8px}
    .searchbox input{font-size:16px}
    .chead{gap:2px}
  }
  @media (max-height:350px){
    .card{max-height:76%}
    .workspace.selected .aboutButton{display:none}
    .topbar{padding-top:3px;padding-bottom:3px}
  }
  .floorCard.mcard { width:min(830px, 100%); max-width:100%; overflow-x:hidden; }
  .fTools { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:6px 0; }
  .fTools button, .floorCard [data-close] { min-width:40px; min-height:40px; padding:0 10px;
    background:var(--tint); color:var(--ink); border:1px solid var(--line); border-radius:8px; }
  .fTools select { max-width:100%; min-height:40px; color:var(--ink); background:var(--panel); }
  .fPlan { display:block; width:100%; height:clamp(145px, min(34vh, 56vw), 320px); border-radius:12px; touch-action:none; }
  .floorCard .rooms { grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr)); }
  .floorCard .rooms button { min-width:0; min-height:44px; text-align:left; white-space:normal; overflow-wrap:anywhere; }
  .floorCard .rooms button span { display:block; font-size:.8em; opacity:.8; }
  .fPlan[hidden], .fTools[hidden], .fTools select[hidden] { display:none; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><b>旗山校区地图</b><span>福建中医药大学</span></div>
    <div class="searchwrap">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5" stroke-linecap="round"/></svg>
        <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" aria-label="搜索楼栋、房号或机构" aria-controls="results" placeholder="楼栋、房号或机构">
        <button type="button" id="btnClearSearch" aria-label="清空搜索" hidden>×</button>
      </div>
      <div id="results" class="results" aria-label="搜索结果" hidden></div>
    </div>
    <div class="modes" role="group" aria-label="地图模式">
      <button type="button" id="btnFlat" aria-pressed="false">平面</button>
      <button type="button" id="btnIso" aria-pressed="true" class="on">2.5D</button>
    </div>
  </header>
  <main id="workspace" class="workspace">
    <div id="mapStage" class="mapstage">
      <canvas id="scene" tabindex="0" aria-label="校园地图。方向键平移，加减键缩放，Home 键查看全图">请输入楼名或教室号查找建筑</canvas>
      <div class="maptools" role="group" aria-label="视角">
        <button type="button" class="zoom" id="btnZoomOut" aria-label="缩小" title="缩小">−</button>
        <button type="button" class="zoom" id="btnZoomIn" aria-label="放大" title="放大">+</button>
        <button type="button" id="btnView" title="旋转视角">旋转</button>
        <button type="button" id="btnReset" title="查看全图">全图</button>
        <button type="button" id="btnLoc" hidden>定位</button>
      </div>
      <div class="minimap" aria-hidden="true"><canvas id="mini" width="280" height="168"></canvas></div>
      <button type="button" id="btnAbout" class="aboutButton">校园示意图 ⓘ</button>
    </div>
    <aside class="card" id="selection" aria-labelledby="cName" hidden>
      <div class="chead">
        <div class="ctitle"><h2 id="cName"></h2><p id="cSub" aria-live="polite"></p></div>
        <button type="button" id="btnDetails" class="details" aria-expanded="false" aria-controls="cardBody">详情</button>
        <button type="button" id="btnCloseSelection" class="icon" aria-label="清除选中建筑" title="清除选中建筑">×</button>
      </div>
      <div class="cardBody" id="cardBody">
        <div class="meta">
          <button type="button" id="btnFloor" hidden>教室目录</button>
          <button type="button" id="btnTt" hidden>返回课表</button>
        </div>
        <div class="routebox">
          <div class="rhd"><strong>步行路线</strong><b id="routeDist"></b></div>
          <div class="rchips" id="routeOrigins" role="group" aria-label="路线起点"></div>
          <p class="rpath" id="routePath" aria-live="polite"></p>
          <div class="btns"><button type="button" id="btnRoute" hidden>路线全览</button></div>
        </div>
      </div>
    </aside>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <div id="about" class="modal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
    <div class="mcard about">
      <div class="mhead"><h2 id="aboutTitle">旗山校区地图</h2><button class="icon" data-close type="button" aria-label="关闭">×</button></div>
      <div class="legend" id="legend"></div>
      <p>拖动平移 · 滚轮或双指缩放 · 点选楼栋查看教室与路线</p>
      <p>建筑模型参照旗山校区官方总平图及现场导览，部分高度为估算。早期底图来自获授权的「旗山校园 · 三维空间研究」。</p>
      <p>地图、楼层和步行时间均为示意，实际通行请以校园指引为准。</p>
    </div>
  </div>
  <div id="floor" class="modal" role="dialog" aria-modal="true" aria-labelledby="fTitle" hidden>
    <div class="mcard floorCard">
      <div class="mhead"><h2 id="fTitle"></h2><button data-close type="button">回校园图</button></div>
      <p class="msub" id="fSub"></p>
      <div class="floors" id="fFloors" role="group" aria-label="选择楼层"></div>
      <div class="fTools"><select id="fOrg" aria-label="按机构筛选" hidden></select>
        <div id="fZoom" class="fTools" role="group" aria-label="平面图视角">
          <button id="fMinus" type="button" aria-label="缩小平面图">−</button>
          <button id="fPlus" type="button" aria-label="放大平面图">+</button>
          <button id="fFit" type="button">适配全图</button>
        </div>
      </div>
      <canvas id="fPlan" class="fPlan" aria-label="楼层平面图，可用下方目录选择房间"></canvas>
      <p class="msub" id="fRoomInfo" role="status"></p>
      <div class="rooms" id="fRooms"></div>
    </div>
  </div>
  <div id="err" class="err" role="alert" hidden>地图绘制失败，请重新打开地图。</div>
</div>

      var p = document.createElement("p");
      p.className = "rempty"; p.setAttribute("role", "status");
      p.textContent = "未找到，试试「图书馆」或「01104」";
      resEl.appendChild(p);
    }
    list.forEach(function (hit) {
      var btn = document.createElement("button"), title = document.createElement("b"), sub = document.createElement("small");
      btn.type = "button"; btn.className = "ritem";
      title.textContent = hit.item ? hit.room + " · " + hit.item.name : hit.room || hit.building.n;
      var no = hit.building.no;
      sub.textContent = hit.item ? [hit.building.n, hit.level + " 层", hit.item.org].filter(Boolean).join(" · ")
        : hit.missing ? hit.building.n + " · 房间未收录"
        : [hit.building.k, no && no + " 号楼"].filter(Boolean).join(" · ");
      btn.appendChild(title);
      if (sub.textContent) btn.appendChild(sub);
      btn.onclick = function () { chooseSearch(hit); };
      resEl.appendChild(btn);
    });
    resEl.hidden = false;
  }
  qEl.addEventListener("input", renderResults);
  qEl.addEventListener("focus", renderResults);
  $("btnClearSearch").onclick = function () { qEl.value = ""; renderResults(); qEl.focus(); };
  qEl.addEventListener("keydown", function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    var first = resEl.querySelector("button");
    if (!first) return;
    if (e.key === "Enter") { e.preventDefault(); first.click(); }
    if (e.key === "ArrowDown") { e.preventDefault(); first.focus(); }
  });
  resEl.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    var next = e.key === "ArrowUp" ? e.target.previousElementSibling || qEl : e.target.nextElementSibling;
    if (next) next.focus();
    e.preventDefault();
  });
  document.addEventListener("pointerdown", function (e) {
    if (!e.target.closest(".searchwrap")) clearResults();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Tab" && activeModal) {
      var targets = [...activeModal.querySelectorAll("button,select")].filter(item => item.offsetParent);
      var first = targets[0], last = targets[targets.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    if (e.key === "Escape") {
      if (closeModal()) return;
      if (!resEl.hidden) { qEl.focus(); clearResults(); return; }
      if (card.classList.contains("expanded")) setDetails(false);
    }
  });

  function originButton(id, label, activate) {
    var button = document.createElement("button");
    button.type = "button"; button.dataset.origin = id; button.textContent = label;
    button.onclick = function () { activate(); refreshRoute(); };
    $("routeOrigins").appendChild(button);
    return button;
  }
  ORIGINS.forEach(function (origin) {
    originButton(origin.id, origin.name, function () { ORIGIN = { kind:"gate", id:origin.id }; });
  });
  originButton("cur", "此楼出发", function () {
    if (ORIGIN.kind === "bld" && ORIGIN.id === SEL) ORIGIN = { kind:"gate", id:"south" };
    else {
      ORIGIN = { kind:"bld", id:SEL };
      setDetails(false);
      toast("起点：" + BYID[SEL].n);
    }
  });
  var loc = originButton("me", "我的位置", function () { ORIGIN = { kind:"gps", id:"me" }; });
  loc.id = "btnCurrentLocation"; loc.hidden = true;
  [["教学楼","#BCD7C5"],["宿舍","#DBC4A0"],["图书馆","#B1CDDE"],
    ["科研","#CCC5DA"],["水系","#B3D7E5"],["路线","#176E5A"]].forEach(function (item) {
    var key = document.createElement("span"), swatch = document.createElement("i");
    swatch.style.background = item[1];
    key.appendChild(swatch);
    key.appendChild(document.createTextNode(item[0]));
    $("legend").appendChild(key);
  });

  function announceReady() {
    window.zqMapReady = true;
    if (pendingFocus) {
      var b = pendingFocus;
      pendingFocus = null;
      focusPoint(b.x, b.y, buildingHeight(b));
    }
    if (canReturnToTimetable) parent.postMessage({ type:"zq-map-ready" }, location.origin);
  }
  function announceSelection() {
    if (canReturnToTimetable) {
      parent.postMessage({ type:"zq-map-selection", target:SELROOM || SEL || "" }, location.origin);
    }
  }
  window.zqMapTarget = function (value) { return openTarget(value, true); };
  window.zqMapTheme = function (theme) { applyTheme(theme); if (activeModal?.id === "floor") drawFloor(false); };
  window.zqMapDismiss = function () {
    if (closeModal()) return true;
    if (!resEl.hidden) { clearResults(); return true; }
    if (card.classList.contains("expanded")) { setDetails(false); return true; }
    return false;
  };
  window.addEventListener("message", function (event) {
    if (!canReturnToTimetable || event.source !== parent || event.origin !== location.origin) return;
    var data = event.data || {};
    if (data.type === "zq-map-target") openTarget(data.building || data.room || data.b, true);
    if (data.type === "zq-map-theme") window.zqMapTheme(data.theme);
  });
  window.addEventListener("error", function () { $("err").hidden = false; });
  window.addEventListener("resize", function () { resize(); if (activeModal?.id === "floor") drawFloor(true); });
  if (window.ResizeObserver) new ResizeObserver(resize).observe($("mapStage"));
  resize();
  if (!openTarget(qs.get("b") || qs.get("room") || qs.get("building"), true)) {
    if (location.hash === "#flat") setMode("flat");
    if (location.hash === "#floor") { openTarget("B40"); openFloor(BYID[SEL]); }
    if (location.hash === "#about") showModal("about");
    if (location.hash === "#b20") openTarget("B20");
  }
})();
</script>
</body>
</html>
